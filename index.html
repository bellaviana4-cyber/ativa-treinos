async function cloudConnect(url,key){url=String(url||'').trim().replace(/\/$/,'');key=String(key||'').trim();if(!/^https:\/\/[a-z0-9.-]+(?::\d+)?$/i.test(url)||!key||key.length<20)throw Error('Preencha uma URL HTTPS e uma chave pública válida.');if(cloud.client&&cloud.config.url===url&&cloud.config.key===key)return;cloud.enabled=false;cloud.rev=null;cloud.client=null;cloud.user=null;cloudMsg('Conectando ao serviço...');await loadSupabase();const c=window.supabase.createClient(url,key,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});cloud.client=c;cloud.config={url,key};localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify(cloud.config));const {data,error}=await c.auth.getUser();if(!error&&data?.user)cloud.user=data.user;cloudMsg(cloud.user?'Conta encontrada. Escolha receber ou enviar os dados.':'Projeto conectado. Entre ou crie uma conta.');render()}

s="sync-hint">Ao fazer login, escolha explicitamente se deseja enviar os dados deste aparelho ou receber os da nuvem. Depois da escolha, as alterações passam a ser sincronizadas automaticamente. Em conflito entre dispositivos, o app bloqueia a substituição silenciosa e pede revisão. Não use uma chave secreta ou service_role aqui.</div></div><div class="card"><h2 class="sectiontitle">Backup e restauração</h2><p class="small subtle" style="margin:9px 0 15px">Os registros novos são guardados localmente neste navegador. Faça backups JSON regularmente, especialmente antes de trocar de celular ou navegador.</p><div class="actions"><button class="btn soft" data-act="backup-export">↓ Exportar backup JSON</button><button class="btn ghost" data-act="backup-import">↑ Restaurar backup</button></div><div class="divider"></div><div class="warn">Este arquivo funciona offline. A sincronização automática só é ativada após conectar sua conta e escolher enviar ou baixar uma cópia. Antes disso, o backup JSON é sua proteção contra perda de dados.</div></div><div class="card"><h2 class="sectiontitle">Sobre o plano</h2><div class="liststeps" style="margin-top:13px"><div><span class="mark">01 ·</span> Período: 19/10/2026 a 28/02/2027</div><div><span class="mark">02 ·</span> Academia: seg / qua / sáb / dom</div><div><span class="mark">03 ·</span> Corrida: ter / qui / dom (gradual)</div><div><span class="mark">04 ·</span> Corrida longa: quinta, evoluindo até 15 km</div><div><span class="mark">05 ·</span> Joelho: acompanhar sintomas e adaptar cargas</div></div><div class="divider"></div><button class="btn bad mini" data-act="clear-local">Apagar meus registros do aplicativo</button><p class="small subtle" style="margin-top:8px">A base histórica incorporada do Hevy continuará disponível.</p></div></div>`}

function lastReps(rep){let m=String(rep||'').match(/^\d+/);return m?Number(m[0]):10}
function estimateWarmup(workKg,i,n){if(workKg===null||workKg===undefined||!Number.isFinite(+workKg)||+workKg<=0)return '';const fraction=n===1?.5:(i===0?.45:.7);return Math.round((+workKg*fraction)*2)/2}

}
else if(d.kind==='run'){

html=modalShell('Registrar corrida','DIÁRIO DE CORRIDA',content,`<button class="btn ghost" data-act="close-modal">Cancelar</button><button class="btn" data-act="save-run">✓ Salvar corrida</button>`);
}

function formSync(target){const d=ui.draft;if(!d)return;const v=target.value;if(target.dataset.field){d[target.dataset.field]=v;if(d.kind==='run'&&['km','time'].includes(target.dataset.field)){let pp=document.getElementById('pace-preview');if(pp)pp.textContent=pace(safeNum(d.km),timeToSec(d.time))}}else if(target.dataset.set){const e=d.items[+target.dataset.i]?.sets[+target.dataset.j];if(e)e[target.dataset.set]=v}else if(target.dataset.tpl){const e=d.items[+target.dataset.i];if(e)e[target.dataset.tpl]=v}else if(target.dataset.exname!==undefined){const i=+target.dataset.exname;if(d.items[i]){d.items[i].name=v;d.items[i].alias=''}}}
function validPain(v){return v===''||v==null||(Number.isFinite(+v)&&+v>=0&&+v<=10)}
function saveStrength(status){const d=ui.draft;if(!d||d.kind!=='strength')return;const completed=d.items.some(x=>x.sets.some(s=>s.t!=='w'&&s.done));if(status==='done'&&!completed)return toast('Marque pelo menos uma série concluída antes de finalizar.','error');if(!validPain(d.painBefore)||!validPain(d.painAfter))return toast('Dor deve estar entre 0 e 10.','error');const log={id:d.editId||uid(),type:'strength',templateId:d.templateId,title:'Treino '+d.templateId+' · '+state.templates[d.templateId]?.name,date:d.date,minutes:safeNum(d.minutes),painBefore:d.painBefore,painAfter:d.painAfter,note:String(d.note||''),status,items:structuredClone(d.items),createdAt:new Date().toISOString()};if(d.editId)state.logs=state.logs.filter(x=>x.id!==d.editId);state.logs.push(log);persist();ui.draft=null;render();toast(status==='done'?'Treino concluído e salvo.':'Rascunho salvo no histórico.')}
function saveRun(){const d=ui.draft;if(!d||d.kind!=='run')return;const km=safeNum(d.km),sec=timeToSec(d.time);if(!Number.isFinite(km)||km<=0||km>250)return toast('Informe uma distância válida em quilômetros.','error');if(!Number.isFinite(sec)||sec<=0||sec>24*3600)return toast('Informe o tempo no formato mm:ss ou hh:mm:ss.','error');if(d.rpe!==''&&(+d.rpe<1||+d.rpe>10))return toast('RPE deve estar entre 1 e 10.','error');if(!validPain(d.painBefore)||!validPain(d.painAfter))return toast('Dor deve estar entre 0 e 10.','error');if(!/^\d{4}-\d\d-\d\d$/.test(d.date))return toast('Informe uma data válida.','error');const log={id:d.editId||uid(),type:'run',date:d.date,title:'Corrida '+d.role.toLowerCase(),role:d.role,km,sec,rpe:d.rpe,painBefore:d.painBefore,painAfter:d.painAfter,note:String(d.note||''),status:'done',createdAt:new Date().toISOString()};if(d.editId)state.logs=state.logs.filter(x=>x.id!==d.editId);state.logs.push(log);persist();ui.draft=null;render();toast(`Corrida salva: ${nfmt(km)} km · ${pace(km,sec)}.`)}
function saveBody(){const d=ui.draft;if(!d||d.kind!=='body')return;let weight=safeNum(d.weight);if(weight<25||weight>300)return toast('Informe um peso válido.','error');const b={id:d.editId||uid(),date:d.date,weight,waist:safeNum(d.waist)||'',hip:safeNum(d.hip)||'',protein:safeNum(d.protein)||'',note:String(d.note||'')};if(d.editId)state.body=state.body.filter(x=>x.id!==d.editId);state.body.push(b);persist();ui.draft=null;render();toast('Medidas atualizadas.')}
function saveTemplate(){let d=ui.draft;if(!d||d.kind!=='template')return;if(!d.items.length||d.items.some(x=>!x.name.trim()||!(+x.sets>=1&&+x.sets<=10)||!Number.isInteger(+x.warmups)||+x.warmups<0||+x.warmups>4))return toast('Revise os nomes e as séries de cada exercício.','error');state.templates[d.id]={id:d.id,name:d.name,focus:d.focus,day:d.day,minutes:Math.max(15,safeNum(d.minutes)),items:structuredClone(d.items.map(x=>({...x,sets:Number(x.sets),warmups:Number(x.warmups||0)})))};persist();ui.draft=null;render();toast('Ficha atualizada. Os registros anteriores foram preservados.')}
function openDetail(id){const h=allActivities().find(x=>x.id===id);if(!h)return toast('Atividade não encontrada.','error');ui.draft={kind:'detail',activity:h};renderModal()}
function editLog(id){const l=state.logs.find(x=>x.id===id);if(!l)return;if(l.type==='strength')openStrength(l.templateId,l.date,l);else openRun(l.date,l.role,l.km,l)}
function delLog(id){if(!confirm('Excluir este registro? A ação não poderá ser desfeita sem um backup.'))return;state.logs=state.logs.filter(x=>x.id!==id);persist();ui.draft=null;render();toast('Registro excluído.')}
function completeState(){const snapshot=structuredClone(state);if(snapshot.hevy===null&&HEVY_SEED.length)snapshot.hevy=HEVY_SEED;return snapshot}
function download(data,filename,mime){const blob=new Blob([data],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1800)}
function exportBackup(){const data={app:'ATIVA',exportedAt:new Date().toISOString(),state:completeState()};download(JSON.stringify(data,null,2),'ativa_backup_'+TODAY+'.json','application/json');toast('Backup exportado em JSON.')}
function parseCSV(csv){csv=csv.replace(/^\uFEFF/,'');let records=[],row=[],part='',q=false;for(let i=0;i<csv.length;i++){const c=csv[i];if(c==='"'){if(q&&csv[i+1]==='"'){part+='"';i++}else q=!q}else if(c===','&&!q){row.push(part);part=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&csv[i+1]==='\n')i++;row.push(part);part='';if(row.some(x=>x!==''))records.push(row);row=[]}else part+=c}row.push(part);if(row.some(x=>x!==''))records.push(row);if(!records.length)return[];let keys=records.shift().map(s=>s.trim());return records.map(r=>Object.fromEntries(keys.map((k,i)=>[k,r[i]??''])))}
function dateFromHevy(s){let m=String(s).toLowerCase().match(/(\d{1,2}) de ([a-zç]+)\.? de (\d{4}),?\s*(\d{1,2}):(\d{2})/);if(!m)return null;let months={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12},month=months[m[2].slice(0,3)];return month?`${m[3]}-${String(month).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`:null}
function parseDateAny(s){if(!s)return null;if(/^\d{4}-\d\d-\d\d/.test(s))return s.slice(0,10);let m=String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;let d=new Date(s);return isNaN(d.getTime())?null:isoDate(d)}
function importHevy(csv){const rows=parseCSV(csv);if(!rows.length||!('exercise_title' in rows[0])||!('start_time' in rows[0]))throw Error('Formato do Hevy não reconhecido: confira as colunas exercise_title e start_time.');let map=new Map();for(const r of rows){const d=dateFromHevy(r.start_time);if(!d)continue;let k=r.start_time+'|'+r.title;if(!map.has(k))map.set(k,{d,t:r.title||'Treino',time:(r.start_time.match(/(\d\d:\d\d)$/)||[])[1]||'',kind:'strength',ex:[],m:0,runs:[],walks:[]});let h=map.get(k),e=h.ex.find(x=>x.n===r.exercise_title);if(!e){e={n:r.exercise_title,s:[]};h.ex.push(e)}e.s.push({kg:r.weight_kg!==''?safeNum(r.weight_kg):null,r:r.reps!==''?safeNum(r.reps):null,t:({normal:'n',warmup:'w',failure:'f',dropset:'d'}[r.set_type]||'n')});if(r.exercise_title.toLowerCase()==='running'&&r.distance_km!=='')h.runs.push({km:safeNum(r.distance_km),sec:safeNum(r.duration_seconds)});if(r.exercise_title.toLowerCase()==='walking'&&r.distance_km!=='')h.walks.push({km:safeNum(r.distance_km),sec:safeNum(r.duration_seconds)})}
let out=[];for(const h of map.values()){let ex=h.ex.filter(x=>!['running','walking','elliptical trainer','cycling','treadmill'].includes(x.n.toLowerCase()));if(ex.length)out.push({id:uid(),d:h.d,time:h.time,t:h.t,kind:'strength',ex,source:'Hevy'});if(h.runs.length)out.push({id:uid(),d:h.d,time:h.time,t:h.t,kind:'run',km:h.runs.reduce((a,b)=>a+b.km,0),sec:h.runs.reduce((a,b)=>a+b.sec,0),source:'Hevy'});if(!ex.length&&!h.runs.length&&h.walks.length)out.push({id:uid(),d:h.d,time:h.time,t:h.t,kind:'walk',km:h.walks.reduce((a,b)=>a+b.km,0),sec:h.walks.reduce((a,b)=>a+b.sec,0),source:'Hevy'})}if(!out.length)throw Error('Nenhuma sessão de corrida ou musculação foi identificada.');out.sort((a,b)=>b.d.localeCompare(a.d));state.hevy=out;persist();render();toast(`${out.length} registros do Hevy importados.`)}
function importStrava(csv){const rows=parseCSV(csv);if(!rows.length)throw Error('Arquivo CSV vazio.');let out=[];for(const r of rows){const keys=Object.keys(r),v=(...aliases)=>{let k=keys.find(k=>aliases.some(a=>pnorm(a)===pnorm(k)));return k?r[k]:''},type=v('Activity Type','Tipo de atividade','Type','Sport Type');if(type&&!/run|corrida|virtualrun|trailrun/i.test(type))continue;const d=parseDateAny(v('Activity Date','Data da atividade','Date','Start Date'));if(!d)continue;let rawDist=v('Distance','Distância','Distance (km)','Distance (mi)'),km=safeNum(rawDist)*(state.settings.stravaUnit==='mi'?1.609344:state.settings.stravaUnit==='m'?.001:1);if(!km||km>250)continue;let time=v('Moving Time','Elapsed Time','Tempo em movimento','Tempo decorrido'),sec=time.includes(':')?timeToSec(time):safeNum(time);if(sec<=0||sec>86400)continue;out.push({id:'strava-'+uid(),d,time:'',t:v('Activity Name','Nome da atividade','Name')||'Corrida Strava',kind:'run',km:Math.round(km*100)/100,sec,source:'Strava'})}if(!out.length)throw Error('Nenhuma corrida válida encontrada. Confirme o tipo de atividade, a unidade e o formato do CSV.');const seen=new Set(state.strava.map(x=>`${x.d}|${x.km}|${x.sec}`));let added=out.filter(x=>!seen.has(`${x.d}|${x.km}|${x.sec}`));state.strava.push(...added);persist();render();toast(`${added.length} corridas do Strava importadas (${out.length-added.length} já existentes).`)}
function restoreBackup(s){let obj=JSON.parse(s),candidate=obj.state||obj;if(!candidate||candidate.v!==2||!candidate.templates||!Array.isArray(candidate.logs)||!Array.isArray(candidate.body))throw Error('Backup não compatível com esta versão do ATIVA.');if(!confirm('Restaurar o backup substituirá os registros e as fichas deste navegador. Deseja continuar?'))return;state=candidate;if(!persist())return;ui.draft=null;render();toast('Backup restaurado com sucesso.')}
async function readFile(input){let f=input.files&&input.files[0];if(!f)return;try{const txt=await f.text();if(input.id==='hevy-file')importHevy(txt);if(input.id==='strava-file')importStrava(txt);if(input.id==='backup-file')restoreBackup(txt)}catch(e){console.error(e);toast(e.message||'Não foi possível importar o arquivo.','error')}finally{input.value=''}}
function dispatch(act,el){let d=ui.draft;switch(act){
case 'nav':ui.page=el.dataset.page;ui.limit=20;ui.draft=null;render();scrollTo({top:0,behavior:'smooth'});break;
case 'prev-week':ui.week=Math.max(0,ui.week-1);render();break;
case 'next-week':ui.week=Math.min(18,ui.week+1);render();break;
case 'new-strength':ui.draft={kind:'choose-strength'};renderModal();break;
case 'new-run':openRun();break;
case 'new-body':openBody();break;
case 'edit-body':openBody(state.body.find(x=>x.id===el.dataset.id));break;
case 'open-workout':openStrength(el.dataset.id||'A',el.dataset.date||TODAY);break;
case 'open-run':openRun(el.dataset.date||TODAY,el.dataset.role||'Livre',el.dataset.km||'');break;
case 'close-modal':ui.draft=null;renderModal();break;
case 'save-strength':saveStrength(el.dataset.status);break;
case 'save-run':saveRun();break;
case 'save-body':saveBody();break;
case 'edit-template':openTemplate(el.dataset.id);break;
case 'save-template':saveTemplate();break;
case 'add-ex':{if(!d||d.kind!=='strength')break;let name=document.getElementById('add-ex-name')?.value.trim();if(!name)return toast('Escreva o nome do exercício.','error');d.items.push({eid:uid(),name,alias:name,sets:Array.from({length:2},()=>({t:'n',kg:lastExercise(name,name)??'',reps:10,rir:2,done:false}))});renderModal();break}
case 'del-ex':if(d?.kind==='strength'){d.items.splice(+el.dataset.i,1);renderModal()}break;
case 'toggle-ex-name':if(d?.kind==='strength'){ui.swapIndex=ui.swapIndex===+el.dataset.i?-1:+el.dataset.i;renderModal()}break;
case 'add-warmup':if(d?.kind==='strength'){let x=d.items[+el.dataset.i],first=x.sets.find(s=>s.t!=='w');x.sets.splice(x.sets.filter(s=>s.t==='w').length,0,{t:'w',kg:estimateWarmup(first?.kg,0,1),reps:8,rir:'',done:false});renderModal()}break;
case 'del-warmup':if(d?.kind==='strength'){let x=d.items[+el.dataset.i],i=x.sets.findLastIndex(s=>s.t==='w');if(i>=0)x.sets.splice(i,1);renderModal()}break;
case 'add-set':if(d?.kind==='strength'){let x=d.items[+el.dataset.i],work=x.sets.filter(s=>s.t!=='w');x.sets.push({t:'n',kg:work.at(-1)?.kg??'',reps:work.at(-1)?.reps??10,rir:2,done:false});renderModal()}break;
case 'del-set':if(d?.kind==='strength'){let x=d.items[+el.dataset.i];if(x.sets.length>1)x.sets.pop();renderModal()}break;
case 'toggle-set':if(d?.kind==='strength'){let x=d.items[+el.dataset.i].sets[+el.dataset.j];x.done=!x.done;renderModal()}break;
case 'del-tpl-ex':if(d?.kind==='template'){d.items.splice(+el.dataset.i,1);renderModal()}break;
case 'add-tpl-ex':if(d?.kind==='template'){d.items.push({id:uid(),name:'Novo exercício',sets:2,warmups:0,rep:'8–12',alias:''});renderModal()}break;
case 'show-detail':openDetail(el.dataset.id);break;
case 'edit-log':editLog(el.dataset.id);break;
case 'delete-log':delLog(el.dataset.id);break;
case 'history-tab':ui.tab=el.dataset.tab;ui.limit=20;render();break;
case 'history-more':ui.limit+=25;render();break;
case 'save-goals':{let goal=safeNum(document.getElementById('set-goal')?.value),start=safeNum(document.getElementById('set-start')?.value),km=safeNum(document.getElementById('set-km')?.value);if(goal<25||start<25||km<1)return toast('Revise as metas informadas.','error');state.settings.goalWeight=goal;state.settings.startingWeight=start;state.settings.goalKm=km;persist();render();toast('Metas atualizadas.');break}
case 'choose-hevy':document.getElementById('hevy-file').click();break;
case 'choose-strava':document.getElementById('strava-file').click();break;
case 'cloud-config':cloudConnect(document.getElementById('cloud-url')?.value,document.getElementById('cloud-key')?.value).catch(e=>{cloudMsg('Não foi possível conectar: '+e.message);toast(e.message,'error')});break;
case 'cloud-login':cloudAuthenticate(false).catch(e=>{cloudMsg('Erro no login: '+e.message);toast(e.message,'error')});break;
case 'cloud-signup':cloudAuthenticate(true).catch(e=>{cloudMsg('Erro ao criar conta: '+e.message);toast(e.message,'error')});break;
case 'cloud-logout':cloudLogout().catch(e=>toast(e.message,'error'));break;
case 'cloud-upload':cloudUpload().then(ok=>{if(ok){render();toast('Dados sincronizados.')}}).catch(e=>{cloudMsg('Envio não concluído: '+e.message);toast(e.message,'error')});break;
case 'cloud-download':cloudDownload().catch(e=>{cloudMsg('Recebimento não concluído: '+e.message);toast(e.message,'error')});break;
case 'backup-export':exportBackup();break;
case 'backup-import':document.getElementById('backup-file').click();break;
case 'clear-local':if(confirm('Apagar todos os registros novos de musculação, corrida e medidas? Exporte um backup antes de continuar.')&&confirm('Confirma a exclusão definitiva dos registros deste navegador?')){state.logs=[];state.body=[];state.strava=[];state.hevy=null;persist();render();toast('Dados locais apagados. Histórico original do Hevy preservado.')}break;
}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el){e.preventDefault();dispatch(el.dataset.act,el)}else if(e.target.id==='overlay'){ui.draft=null;renderModal()}});
document.addEventListener('input',e=>{if(ui.draft&&(e.target.dataset.field||e.target.dataset.set||e.target.dataset.tpl||e.target.dataset.exname!==undefined))formSync(e.target)});
document.addEventListener('change',e=>{if(ui.draft&&(e.target.dataset.field||e.target.dataset.set||e.target.dataset.tpl||e.target.dataset.exname!==undefined))formSync(e.target);if(e.target.id==='progress-ex'){ui.filterEx=e.target.value;render()}if(e.target.id==='strava-unit'){state.settings.stravaUnit=e.target.value;persist()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.draft){ui.draft=null;renderModal()}});
['hevy-file','strava-file','backup-file'].forEach(id=>document.getElementById(id).addEventListener('change',e=>readFile(e.target)));
render();
</script><script src="./updates.js"></script></body></html>
